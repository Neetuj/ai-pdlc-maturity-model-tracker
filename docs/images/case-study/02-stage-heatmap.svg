<svg width="1400" height="960" viewBox="0 0 1400 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capability maturity heat map">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .stage-label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .cap-label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .status-label { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .muted { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #dfe7f2; stroke-width: 1; }
      .stage-bar { fill: #edf5ff; stroke: #bfd4ff; stroke-width: 1; }
      .row-box { fill: #f8fafc; stroke: #e3e8f0; stroke-width: 1; }
      .green { fill: #dff7e8; }
      .amber { fill: #fff2ce; }
      .blue { fill: #dfeafe; }
      .purple { fill: #ece7ff; }
      .gray { fill: #edf2f7; }
      .badge { fill: #e2e8f0; }
      .badge-text { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1400" height="960" fill="#f5f7fb"/>
  <rect x="70" y="42" width="1260" height="860" rx="22" class="panel"/>

  <text x="110" y="92" class="title">Capability maturity heat map</text>
  <text x="110" y="118" class="subtitle">Org roll-up: stage summary plus the capability rows that generate the stage score</text>

  <g transform="translate(110,150)">
    <rect x="0" y="0" width="1180" height="62" rx="12" class="stage-bar"/>
    <text x="24" y="38" class="stage-label">Discover &amp; Plan</text>
    <rect x="980" y="14" width="170" height="34" rx="17" class="green"/>
    <text x="1056" y="36" class="status-label">L3 stage average</text>
  </g>

  <g transform="translate(110,222)">
    <rect x="0" y="0" width="1180" height="92" rx="12" class="row-box"/>
    <text x="24" y="30" class="cap-label">Market &amp; customer research</text>
    <text x="24" y="54" class="cap-label">Roadmap prioritization</text>
    <rect x="980" y="30" width="170" height="28" rx="14" class="green"/>
    <text x="1056" y="49" class="status-label">L3</text>
    <rect x="1150" y="30" width="20" height="20" rx="10" class="badge"/>
    <text x="1157" y="45" class="badge-text">P1</text>
  </g>

  <g transform="translate(110,326)">
    <rect x="0" y="0" width="1180" height="62" rx="12" class="stage-bar"/>
    <text x="24" y="38" class="stage-label">Build &amp; Validate</text>
    <rect x="980" y="14" width="170" height="34" rx="17" class="amber"/>
    <text x="1056" y="36" class="status-label">L2 stage average</text>
  </g>

  <g transform="translate(110,398)">
    <rect x="0" y="0" width="1180" height="120" rx="12" class="row-box"/>
    <text x="24" y="30" class="cap-label">AI-assisted coding</text>
    <text x="24" y="54" class="cap-label">Test creation &amp; automation</text>
    <text x="24" y="78" class="cap-label">Security reviews</text>
    <rect x="980" y="46" width="170" height="28" rx="14" class="amber"/>
    <text x="1056" y="65" class="status-label">L2</text>
    <rect x="1150" y="46" width="20" height="20" rx="10" class="badge"/>
    <text x="1157" y="61" class="badge-text">P0</text>
  </g>

  <g transform="translate(110,530)">
    <rect x="0" y="0" width="1180" height="62" rx="12" class="stage-bar"/>
    <text x="24" y="38" class="stage-label">Operate, Support &amp; Resilience</text>
    <rect x="980" y="14" width="170" height="34" rx="17" class="blue"/>
    <text x="1056" y="36" class="status-label">L3 stage average</text>
  </g>

  <g transform="translate(110,602)">
    <rect x="0" y="0" width="1180" height="120" rx="12" class="row-box"/>
    <text x="24" y="30" class="cap-label">Support ticket triage</text>
    <text x="24" y="54" class="cap-label">Incident detection &amp; management</text>
    <text x="24" y="78" class="cap-label">SLA / SLO tracking</text>
    <rect x="980" y="46" width="170" height="28" rx="14" class="blue"/>
    <text x="1056" y="65" class="status-label">L3</text>
    <rect x="1150" y="46" width="20" height="20" rx="10" class="badge"/>
    <text x="1157" y="61" class="badge-text">P0</text>
  </g>

  <g transform="translate(110,734)">
    <rect x="0" y="0" width="1180" height="62" rx="12" class="stage-bar"/>
    <text x="24" y="38" class="stage-label">Lead &amp; Run the Org</text>
    <rect x="980" y="14" width="170" height="34" rx="17" class="gray"/>
    <text x="1036" y="36" class="status-label">Not assessed</text>
  </g>
</svg>
