<svg width="1400" height="840" viewBox="0 0 1400 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PDLC heatmap — stage pulse + capability gaps">
  <defs>
    <style>
      .title { font: 800 32px 'Segoe UI', Arial, sans-serif; fill: #1f2d3d; }
      .row-label { font: 800 18px 'Segoe UI', Arial, sans-serif; fill: #22324a; }
      .cell-label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #54657b; }
      .stage-header { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #52657c; }
      .muted { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #6b7c90; }
      .badge { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .light { fill: #ebf1fa; stroke: #dfe7f2; stroke-width: 1; }
      .soft { fill: #f8fafc; stroke: #dfe7f2; stroke-width: 1; }
      .stage { fill: #dfeaff; stroke: #c3d5f8; stroke-width: 1; }
      .gray { fill: #edf2f7; stroke: #dfe7f2; stroke-width: 1; }
      .amber { fill: #f9e8b8; stroke: #e4d28b; stroke-width: 1; }
      .lav { fill: #e9f0ff; stroke: #d5ddff; stroke-width: 1; }
      .red { fill: #f4d1d1; }
      .red-ring { fill: #e56363; }
      .empty { fill: #f3f6fa; stroke: #dfe7f2; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="840" fill="#f3f6fb"/>
  <rect x="56" y="42" width="1288" height="720" rx="22" fill="#ffffff" stroke="#dfe7f2"/>

  <text x="90" y="96" class="title">PDLC heatmap — stage pulse + capability gaps</text>

  <g>
    <rect x="90" y="138" width="280" height="52" rx="12" class="light"/>
    <text x="122" y="170" class="row-label">Stage</text>

    <rect x="372" y="138" width="120" height="52" rx="12" class="light"/>
    <text x="420" y="170" class="cell-label" text-anchor="middle">L1</text>

    <rect x="494" y="138" width="120" height="52" rx="12" class="light"/>
    <text x="548" y="170" class="cell-label" text-anchor="middle">L2</text>

    <rect x="616" y="138" width="120" height="52" rx="12" class="light"/>
    <text x="670" y="170" class="cell-label" text-anchor="middle">L3</text>

    <rect x="738" y="138" width="120" height="52" rx="12" class="light"/>
    <text x="792" y="170" class="cell-label" text-anchor="middle">L4</text>

    <rect x="860" y="138" width="120" height="52" rx="12" class="light"/>
    <text x="914" y="170" class="cell-label" text-anchor="middle">L5</text>
  </g>

  <g>
    <rect x="90" y="210" width="280" height="62" rx="14" class="stage"/>
    <text x="122" y="248" class="row-label">Discover &amp; Plan</text>
    <rect x="372" y="218" width="120" height="46" rx="10" class="gray"/>
    <text x="432" y="247" class="muted" text-anchor="middle">—</text>
    <rect x="494" y="218" width="120" height="46" rx="10" class="amber"/>
    <text x="554" y="247" class="muted" text-anchor="middle">2</text>
    <rect x="616" y="218" width="120" height="46" rx="10" class="gray"/>
    <text x="676" y="247" class="muted" text-anchor="middle">—</text>
    <rect x="738" y="218" width="120" height="46" rx="10" class="gray"/>
    <text x="798" y="247" class="muted" text-anchor="middle">—</text>
    <rect x="860" y="218" width="120" height="46" rx="10" class="gray"/>
    <text x="920" y="247" class="muted" text-anchor="middle">—</text>
  </g>

  <g>
    <rect x="90" y="292" width="280" height="74" rx="14" class="soft"/>
    <text x="118" y="326" class="row-label">Roadmap</text>
    <text x="118" y="348" class="row-label">prioritization</text>
    <circle cx="300" cy="326" r="25" class="red-ring"/>
    <text x="300" y="332" class="badge" text-anchor="middle">P0</text>
    <text x="300" y="347" class="badge" text-anchor="middle" font-size="10">Invest</text>
    <text x="300" y="359" class="badge" text-anchor="middle" font-size="10">Now</text>
    <rect x="372" y="299" width="120" height="54" rx="10" class="gray"/>
    <text x="432" y="334" class="muted" text-anchor="middle">—</text>
    <rect x="494" y="299" width="120" height="54" rx="10" class="amber"/>
    <text x="554" y="334" class="muted" text-anchor="middle">1</text>
    <rect x="616" y="299" width="120" height="54" rx="10" class="gray"/>
    <text x="676" y="334" class="muted" text-anchor="middle">—</text>
    <rect x="738" y="299" width="120" height="54" rx="10" class="gray"/>
    <text x="798" y="334" class="muted" text-anchor="middle">—</text>
    <rect x="860" y="299" width="120" height="54" rx="10" class="gray"/>
    <text x="920" y="334" class="muted" text-anchor="middle">—</text>
  </g>

  <g>
    <rect x="90" y="386" width="280" height="74" rx="14" class="soft"/>
    <text x="118" y="420" class="row-label">Customer</text>
    <text x="118" y="442" class="row-label">research</text>
    <circle cx="300" cy="420" r="25" class="red-ring"/>
    <text x="300" y="426" class="badge" text-anchor="middle">P0</text>
    <text x="300" y="441" class="badge" text-anchor="middle" font-size="10">Invest</text>
    <text x="300" y="453" class="badge" text-anchor="middle" font-size="10">Now</text>
    <rect x="372" y="393" width="120" height="54" rx="10" class="gray"/>
    <text x="432" y="428" class="muted" text-anchor="middle">—</text>
    <rect x="494" y="393" width="120" height="54" rx="10" class="amber"/>
    <text x="554" y="428" class="muted" text-anchor="middle">1</text>
    <rect x="616" y="393" width="120" height="54" rx="10" class="amber"/>
    <text x="676" y="428" class="muted" text-anchor="middle">1</text>
    <rect x="738" y="393" width="120" height="54" rx="10" class="gray"/>
    <text x="798" y="428" class="muted" text-anchor="middle">—</text>
    <rect x="860" y="393" width="120" height="54" rx="10" class="gray"/>
    <text x="920" y="428" class="muted" text-anchor="middle">—</text>
  </g>
</svg>
